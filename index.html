<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мясковский против Буханы</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            background-color: #0d0f18;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 100vh;
            max-height: 900px;
            background: linear-gradient(180deg, #0f1423 0%, #080a10 100%);
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(15, 20, 35, 0.9);
            border-bottom: 2px solid #2a3550;
            z-index: 10;
        }
        
        /* Полицейский погон */
        .epaulette {
            position: relative;
            width: 160px;
            height: 52px;
            background: linear-gradient(135deg, #1b2845 0%, #274068 50%, #111a2e 100%);
            border: 2px solid #e0aa3e;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 0 8px rgba(224, 170, 62, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px 8px;
            overflow: hidden;
        }
        .epaulette::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: #d62828;
