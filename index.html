<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Мясковский против Буханы</title>
<style>
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    margin: 0;
    padding: 0;
  }
  body {
    background-color: #0b0c10;
    color: #fff;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }
  #game-wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    max-width: 440px;
    max-height: 800px;
    background: radial-gradient(circle at center, #1f2430 0%, #0b0c10 100%);
    box-shadow: 0 0 35px rgba(0,0,0,0.8);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>

<div id="game-wrap">
  <canvas id="gameCanvas"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const WIDTH = 400;
const HEIGHT = 700;

function resizeCanvas() {
  canvas.width = WIDTH;
  canvas.height = HEIGHT;
}
resizeCanvas();

let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playSound(type) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;

  if (type === 'bounce') {
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(160, now);
    osc.frequency.exponentialRampToValueAtTime(350, now + 0.07);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.07);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.07);
  } 
  else if (type === 'crunch') {
    let bufferSize = audioCtx.sampleRate * 0.1;
    let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    let data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    let noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    let filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 800;
    let gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.35, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start(now);
  }
  else if (type === 'star') {
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(523.25, now);
    osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.12);
  }
  else if (type === 'fanfare') {
    const freqs = [523.25, 659.25, 783.99, 1046.50];
    freqs.forEach((freq, idx) => {
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now + idx * 0.08);
      gain.gain.setValueAtTime(0.3, now + idx * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + idx * 0.08);
      osc.stop(now + idx * 0.08 + 0.25);
    });
  }
}

const RANKS = [
  { stars: 0, title: 'Рядовой' },
  { stars: 10, title: 'Сержант' },
  { stars: 30, title: 'Лейтенант' },
  { stars: 60, title: 'Капитан' },
  { stars: 100, title: 'Майор' },
  { stars: 150, title: 'Полковник' },
  { stars: 250, title: 'Генерал полиции 👮‍♂️' }
];

let gameState = 'START';
let score = 0;
let totalStars = 0;
let currentRankIdx = 0;
let promotionBannerTimer = 0;
let newRankTitle = '';

const paddle = {
  width: 90,
  height: 16,
  x: WIDTH / 2 - 45,
  y: HEIGHT - 50,
  dx: 0
};

const ball = {
  x: WIDTH / 2,
  y: HEIGHT - 70,
  radius: 18,
  vx: 0,
  vy: 0,
  speed: 6.5,
  angle: 0,
  attached: true
};

let bricks = [];
let particles = [];
let flyingStars = [];
let fireworks = [];

function initBricks() {
  bricks = [];
  const rows = 5;
  const cols = 6;
  const padding = 8;
  const offsetTop = 130;
  const offsetLeft = 12;
  const brickW = (WIDTH - offsetLeft * 2 - (cols - 1) * padding) / cols;
  const brickH = 26;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      let type = 'wheat';
      let hp = 1;
      let rand = Math.random();
      
      if (r === 0 || rand < 0.15) {
        type = 'brioche';
        hp = 3;
      } else if (r === 1 || rand < 0.45) {
        type = 'rye';
        hp = 2;
      }

      bricks.push({
        x: offsetLeft + c * (brickW + padding),
        y: offsetTop + r * (brickH + padding),
        w: brickW,
        h: brickH,
        type: type,
        hp: hp,
        maxHp: hp
      });
    }
  }
}

function launchBall() {
  if (ball.attached) {
    ball.attached = false;
    ball.vx = (Math.random() - 0.5) * 4;
    ball.vy = -ball.speed;
  }
}

function handlePointer(clientX) {
  initAudio();
  const rect = canvas.getBoundingClientRect();
  const scaleX = WIDTH / rect.width;
  const canvasX = (clientX - rect.left) * scaleX;
  
  paddle.x = canvasX - paddle.width / 2;
  if (paddle.x < 0) paddle.x = 0;
  if (paddle.x + paddle.width > WIDTH) paddle.x = WIDTH - paddle.width;

  if (ball.attached) {
    ball.x = paddle.x + paddle.width / 2;
  }
}

window.addEventListener('mousemove', e => {
  if (gameState === 'PLAYING' || gameState === 'START') {
    handlePointer(e.clientX);
  }
});

window.addEventListener('touchmove', e => {
  if (e.touches.length > 0) {
    handlePointer(e.touches[0].clientX);
  }
}, { passive: true });

window.addEventListener('click', () => {
  initAudio();
  if (gameState === 'START' || gameState === 'GAMEOVER') {
    resetGame();
    gameState = 'PLAYING';
    launchBall();
  } else if (gameState === 'PLAYING' && ball.attached) {
    launchBall();
  }
});

function resetGame() {
  score = 0;
  totalStars = 0;
  currentRankIdx = 0;
  paddle.x = WIDTH / 2 - paddle.width / 2;
  ball.attached = true;
  ball.x = paddle.x + paddle.width / 2;
  ball.y = paddle.y - ball.radius;
  particles = [];
  flyingStars = [];
  fireworks = [];
  initBricks();
}

function update() {
  if (gameState !== 'PLAYING' && gameState !== 'PROMOTION') return;

  if (!ball.attached) {
    ball.x += ball.vx;
    ball.y += ball.vy;
    ball.angle += (ball.vx * 0.05);

    particles.push({
      x: ball.x + (Math.random() - 0.5) * 8,
      y: ball.y + (Math.random() - 0.5) * 8,
      vx: -ball.vx * 0.2 + (Math.random() - 0.5) * 1.5,
      vy: -ball.vy * 0.2 + (Math.random() - 0.5) * 1.5,
      size: Math.random() * 5 + 3,
      life: 1.0,
      color: Math.random() > 0.5 ? '#ff4500' : '#ffa500'
    });

    if (ball.x - ball.radius <= 0) {
      ball.x = ball.radius;
      ball.vx *= -1;
      playSound('bounce');
    }
    if (ball.x + ball.radius >= WIDTH) {
      ball.x = WIDTH - ball.radius;
      ball.vx *= -1;
      playSound('bounce');
    }
    if (ball.y - ball.radius <= 0) {
      ball.y = ball.radius;
      ball.vy *= -1;
      playSound('bounce');
    }

    if (ball.y - ball.radius > HEIGHT) {
      gameState = 'GAMEOVER';
    }

    if (
      ball.y + ball.radius >= paddle.y &&
      ball.y - ball.radius <= paddle.y + paddle.height &&
      ball.x >= paddle.x &&
      ball.x <= paddle.x + paddle.width &&
      ball.vy > 0
    ) {
      ball.vy = -ball.speed;
      let hitPoint = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
      ball.vx = hitPoint * 6;
      playSound('bounce');
    }

    bricks.forEach(b => {
      if (b.hp > 0) {
        if (
          ball.x + ball.radius > b.x &&
          ball.x - ball.radius < b.x + b.w &&
          ball.y + ball.radius > b.y &&
          ball.y - ball.radius < b.y + b.h
        ) {
          b.hp--;
          ball.vy *= -1;
          playSound('crunch');

          for (let i = 0; i < 8; i++) {
            particles.push({
              x: ball.x,
              y: ball.y,
              vx: (Math.random() - 0.5) * 5,
              vy: (Math.random() - 0.5) * 5,
              size: Math.random() * 4 + 2,
              life: 1.0,
              color: b.type === 'rye' ? '#6e4726' : (b.type === 'brioche' ? '#ffe066' : '#e6b800')
            });
          }

          if (b.hp <= 0) {
            score += b.maxHp * 100;
            
            flyingStars.push({
              x: b.x + b.w / 2,
              y: b.y + b.h / 2,
              startX: b.x + b.w / 2,
              startY: b.y + b.h / 2,
              targetX: 340,
              targetY: 45,
              progress: 0,
              speed: 0.03 + Math.random() * 0.01
            });
          }
        }
      }
    });

    if (bricks.every(b => b.hp <= 0)) {
      initBricks();
      ball.speed += 0.5;
      ball.attached = true;
      ball.x = paddle.x + paddle.width / 2;
      ball.y = paddle.y - ball.radius;
    }
  }

  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.03;
  });
  particles = particles.filter(p => p.life > 0);

  flyingStars.forEach(s => {
    s.progress += s.speed;
    let t = s.progress;
    s.x = (1 - t) * s.startX + t * s.targetX;
    s.y = (1 - t) * s.startY + t * s.targetY - Math.sin(t * Math.PI) * 80;

    if (s.progress >= 1) {
      totalStars++;
      playSound('star');
      checkRankPromotion();
    }
  });
  flyingStars = flyingStars.filter(s => s.progress < 1);

  fireworks.forEach(f => {
    f.x += f.vx;
    f.y += f.vy;
    f.life -= 0.02;
  });
  fireworks = fireworks.filter(f => f.life > 0);

  if (promotionBannerTimer > 0) {
    promotionBannerTimer--;
  }
}

function checkRankPromotion() {
  for (let i = RANKS.length - 1; i >= 0; i--) {
    if (totalStars >= RANKS[i].stars && i > currentRankIdx) {
      currentRankIdx = i;
      newRankTitle = RANKS[i].title;
      promotionBannerTimer = 150;
      playSound('fanfare');

      for (let k = 0; k < 40; k++) {
        fireworks.push({
          x: WIDTH / 2,
          y: 200,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          color: `hsl(${Math.random() * 60 + 40}, 100%, 60%)`,
          life: 1.0,
          size: Math.random() * 5 + 3
        });
      }
      break;
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, WIDTH, HEIGHT);

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
  ctx.lineWidth = 1;
  for (let i = 0; i < WIDTH; i += 20) {
    ctx.beginPath();
    ctx.moveTo(i, 0);
    ctx.lineTo(i, HEIGHT);
    ctx.stroke();
  }

  drawEpaulette();

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(`Счёт: ${score}`, 16, 35);
  
  ctx.fillStyle = '#ffd700';
  ctx.font = '13px sans-serif';
  ctx.fillText(`Звание: ${RANKS[currentRankIdx].title}`, 16, 58);

  bricks.forEach(b => {
    if (b.hp > 0) {
      ctx.save();
      
      if (b.type === 'brioche') {
        ctx.fillStyle = '#ffd700';
        ctx.shadowColor = '#ffae00';
        ctx.shadowBlur = 8;
      } else if (b.type === 'rye') {
        ctx.fillStyle = '#5c3a21';
      } else {
        ctx.fillStyle = '#d49b4b';
      }

      ctx.beginPath();
      ctx.roundRect(b.x, b.y, b.w, b.h, 6);
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(b.x + 8, b.y + 6);
      ctx.lineTo(b.x + b.w - 8, b.y + b.h - 6);
      ctx.stroke();

      if (b.hp < b.maxHp) {
        ctx.strokeStyle = '#000';
        ctx.beginPath();
        ctx.moveTo(b.x + b.w * 0.3, b.y + 4);
        ctx.lineTo(b.x + b.w * 0.5, b.y + b.h - 4);
        ctx.stroke();
      }

      ctx.restore();
    }
  });

  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1.0;

  drawSteak();

  ctx.fillStyle = '#e63946';
  ctx.beginPath();
  ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 8);
  ctx.fill();
  ctx.fillStyle = '#ff7b00';
  ctx.fillRect(paddle.x + 10, paddle.y + 3, paddle.width - 20, 3);

  flyingStars.forEach(s => {
    drawStar(s.x, s.y, 5, 12, 6, '#ffd700');
  });

  fireworks.forEach(f => {
    ctx.fillStyle = f.color;
    ctx.globalAlpha = f.life;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1.0;

  if (promotionBannerTimer > 0) {
    ctx.save();
    ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
    ctx.fillRect(0, HEIGHT / 2 - 60, WIDTH, 120);

    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('ПОШИВ НОВЫХ ПОГОН!', WIDTH / 2, HEIGHT / 2 - 15);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px sans-serif';
    ctx.fillText(`Новое звание: ${newRankTitle}`, WIDTH / 2, HEIGHT / 2 + 25);
    ctx.restore();
  }

  if (gameState === 'START') {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 24px sans-serif';
    ctx.fillText('МЯСКОВСКИЙ против БУХАНЫ', WIDTH / 2, HEIGHT / 2 - 30);
    ctx.font = '16px sans-serif';
    ctx.fillStyle = '#ffd700';
    ctx.fillText('Нажми на экран для старта', WIDTH / 2, HEIGHT / 2 + 20);
  } else if (gameState === 'GAMEOVER') {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    ctx.fillStyle = '#ff4d4d';
    ctx.textAlign = 'center';
    ctx.font = 'bold 28px sans-serif';
    ctx.fillText('БУХАНЫ ПОБЕДИЛИ!', WIDTH / 2, HEIGHT / 2 - 30);
    ctx.fillStyle = '#fff';
    ctx.font = '18px sans-serif';
    ctx.fillText(`Ваш счёт: ${score}`, WIDTH / 2, HEIGHT / 2 + 10);
    ctx.fillText(`Звёзд собрано: ${totalStars}`, WIDTH / 2, HEIGHT / 2 + 35);
    ctx.fillStyle = '#ffd700';
    ctx.fillText('Нажмите, чтобы начать заново', WIDTH / 2, HEIGHT / 2 + 85);
  }
}

function drawSteak() {
  ctx.save();
  ctx.translate(ball.x, ball.y);
  ctx.rotate(ball.angle);

  ctx.fillStyle = '#8b2626';
  ctx.beginPath();
  ctx.ellipse(0, 0, ball.radius * 1.2, ball.radius * 0.9, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#a83232';
  ctx.beginPath();
  ctx.ellipse(-2, -1, ball.radius * 0.9, ball.radius * 0.7, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#f5f0e1';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(-ball.radius * 0.6, 0);
  ctx.lineTo(ball.radius * 0.6, 0);
  ctx.moveTo(0, 0);
  ctx.lineTo(0, ball.radius * 0.5);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(40, 10, 10, 0.6)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-10, -8); ctx.lineTo(-2, 10);
  ctx.moveTo(0, -10);  ctx.lineTo(8, 8);
  ctx.stroke();

  ctx.restore();
}

function drawEpaulette() {
  const x = 310;
  const y = 15;
  const w = 65;
  const h = 60;

  ctx.fillStyle = '#1b2a4a';
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, 6);
  ctx.fill();

  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = '#d32f2f';
  ctx.fillRect(x + w / 2 - 2, y + 4, 4, h - 8);

  drawStar(x + 18, y + 30, 5, 8, 4, '#ffd700');
  
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 13px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`${totalStars}`, x + 44, y + 34);
}

function drawStar(cx, cy, spikes, outerRadius, innerRadius, color) {
  let rot = Math.PI / 2 * 3;
  let x = cx;
  let y = cy;
  let step = Math.PI / spikes;

  ctx.beginPath();
  ctx.moveTo(cx, cy - outerRadius);
  for (let i = 0; i < spikes; i++) {
    x = cx + Math.cos(rot) * outerRadius;
    y = cy + Math.sin(rot) * outerRadius;
    ctx.lineTo(x, y);
    rot += step;

    x = cx + Math.cos(rot) * innerRadius;
    y = cy + Math.sin(rot) * innerRadius;
    ctx.lineTo(x, y);
    rot += step;
  }
  ctx.lineTo(cx, cy - outerRadius);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
